<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>30-Day CDISC Clinical Programming Mastery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #0d1525;
    --bg-row-even: #1a202c;
    --bg-row-odd: #0f172a;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --text-dim: #475569;
    --border-color: #334155;
    --border-light: #1e293b;
    --card-bg: #1a202c;
    --tag-bg: #0f172a;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
    --accent-1: #38bdf8;
    --accent-2: #a78bfa;
    --accent-3: #4ade80;
    --accent-4: #fb923c;
    --deliverable-color: #a5f3fc;
  }

  [data-theme="light"] {
    --bg-primary: #f0f4f8;
    --bg-secondary: #ffffff;
    --bg-tertiary: #e2e8f0;
    --bg-row-even: #ffffff;
    --bg-row-odd: #f7fafc;
    --text-primary: #1e293b;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
    --border-color: #cbd5e1;
    --border-light: #e2e8f0;
    --card-bg: #ffffff;
    --tag-bg: #f1f5f9;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --accent-1: #0284c7;
    --accent-2: #7c3aed;
    --accent-3: #16a34a;
    --accent-4: #ea580c;
    --deliverable-color: #0e7490;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Playfair Display', Georgia, serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    transition: background 0.35s, color 0.35s;
  }

  /* ─── THEME TOGGLE ─── */
  .theme-toggle {
    position: fixed;
    top: 18px;
    right: 22px;
    z-index: 100;
    width: 56px;
    height: 28px;
    border-radius: 14px;
    background: var(--bg-secondary);
    border: 1.5px solid var(--border-color);
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    padding: 0 3px;
  }
  .theme-toggle .knob {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent-1);
    transition: transform 0.3s, background 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  [data-theme="light"] .theme-toggle .knob { transform: translateX(28px); background: var(--accent-4); }

  /* ─── HEADER ─── */
  .header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    padding: 32px 24px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: background 0.35s, border-color 0.35s;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -70px; right: -50px;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(167,139,250,0.05) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner { position: relative; z-index: 1; }
  .header-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: 25px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    transition: color 0.35s;
  }
  .header p {
    font-size: 12.5px;
    color: var(--text-muted);
    font-style: italic;
    transition: color 0.35s;
  }

  /* ─── WEEK TABS ─── */
  .week-tabs {
    display: flex;
    background: var(--bg-primary);
    border-bottom: 1px solid var(--border-light);
    overflow-x: auto;
    transition: background 0.35s, border-color 0.35s;
  }
  .week-tab {
    flex: 1 1 auto;
    min-width: 105px;
    padding: 13px 14px;
    background: transparent;
    border: none;
    border-bottom: 2.5px solid transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'Playfair Display', serif;
    font-size: 11.5px;
    text-align: center;
    transition: all 0.22s;
  }
  .week-tab:hover { color: var(--text-secondary); }
  .week-tab .tab-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 3px;
  }
  .week-tab .tab-title { font-size: 10.5px; }

  .week-tab[data-active="true"] { background: transparent; }
  .week-tab[data-week="0"][data-active="true"] { color: var(--accent-1); border-bottom-color: var(--accent-1); }
  .week-tab[data-week="1"][data-active="true"] { color: var(--accent-2); border-bottom-color: var(--accent-2); }
  .week-tab[data-week="2"][data-active="true"] { color: var(--accent-3); border-bottom-color: var(--accent-3); }
  .week-tab[data-week="3"][data-active="true"] { color: var(--accent-4); border-bottom-color: var(--accent-4); }

  /* ─── WEEK HEADER BAR ─── */
  .week-header {
    padding: 16px 22px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    transition: background 0.35s, border-color 0.35s;
  }
  .week-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    padding: 4px 10px;
    border-radius: 3px;
    color: #0f172a;
    font-weight: 600;
  }
  .week-header-text h2 { font-size: 15.5px; font-weight: 600; color: var(--text-primary); transition: color 0.35s; }
  .week-header-text p { font-size: 11.5px; font-style: italic; margin-top: 2px; transition: color 0.35s; }

  /* ─── TABLE WRAPPER ─── */
  .table-wrap {
    overflow-x: auto;
    padding: 14px 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 740px;
  }
  thead tr { border-bottom: 1px solid var(--border-light); }
  thead th {
    text-align: left;
    padding: 9px 11px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
    transition: color 0.35s;
  }
  thead th { border-bottom: 1px solid var(--border-light); }

  /* ─── TABLE ROWS ─── */
  .day-row {
    cursor: pointer;
    border-bottom: 1px solid var(--border-light);
    transition: background 0.15s;
    vertical-align: top;
  }
  .day-row:hover { background: rgba(56,189,248,0.03); }
  .day-row td { padding: 11px 11px; }

  /* Day badge */
  .day-badge {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
  }

  /* Focus */
  .focus-text { font-size: 11.5px; color: var(--text-primary); line-height: 1.45; transition: color 0.35s; }

  /* Topic */
  .topic-text { font-size: 10.8px; color: var(--text-secondary); font-style: italic; line-height: 1.45; transition: color 0.35s; }

  /* Details */
  .details-text {
    font-size: 10.2px;
    color: var(--text-dim);
    line-height: 1.6;
    transition: color 0.25s, max-height 0.3s;
    overflow: hidden;
    max-height: 38px;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    display: -webkit-box;
  }
  .details-text.expanded {
    max-height: 200px;
    -webkit-line-clamp: unset;
    color: var(--text-secondary);
  }
  .expand-hint {
    font-size: 9px;
    margin-top: 3px;
    opacity: 0.6;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Package tags */
  .pkg-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .pkg-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 3px;
    border: 1px solid transparent;
    transition: all 0.2s;
  }
  .pkg-none { color: var(--text-dim); font-size: 9.5px; font-family: 'IBM Plex Mono', monospace; }

  /* Deliverable */
  .deliverable-text {
    font-size: 10px;
    line-height: 1.5;
    font-style: italic;
    border-left: 2px solid transparent;
    padding-left: 8px;
    color: var(--text-dim);
    transition: color 0.25s;
  }

  /* Expanded row state */
  .day-row[data-expanded="true"] .details-text { max-height: 200px; -webkit-line-clamp: unset; color: var(--text-secondary); }
  .day-row[data-expanded="true"] .expand-hint { display: none; }
  .day-row[data-expanded="true"] .deliverable-text { color: var(--deliverable-color); }

  /* ─── RESOURCES PANEL ─── */
  .resources-panel {
    margin: 6px 16px 10px;
    padding: 13px 17px;
    background: var(--card-bg);
    border-radius: 6px;
    border: 1px solid var(--border-color);
    transition: background 0.35s, border-color 0.35s;
  }
  .resources-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .resources-tags { display: flex; flex-wrap: wrap; gap: 7px; }
  .resource-tag {
    font-size: 9.5px;
    color: var(--text-secondary);
    background: var(--tag-bg);
    padding: 3px 9px;
    border-radius: 3px;
    border: 1px solid var(--border-color);
    transition: background 0.35s, border-color 0.35s, color 0.35s;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-section {
    padding: 12px 16px 18px;
  }
  .progress-row { display: flex; align-items: center; gap: 10px; }
  .progress-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    min-width: 60px;
  }
  .progress-track {
    flex: 1;
    height: 4px;
    background: var(--border-light);
    border-radius: 2px;
    overflow: hidden;
    transition: background 0.35s;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s ease, background 0.3s;
  }
  .progress-pct {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    min-width: 38px;
    text-align: right;
  }

  /* ─── LEGEND ─── */
  .legend {
    padding: 0 16px 14px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend-text { font-size: 9px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .legend-hint { font-size: 9px; color: var(--text-dim); margin-left: auto; font-family: 'IBM Plex Mono', monospace; opacity: 0.7; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    .header h1 { font-size: 19px; }
    .week-tab { min-width: 80px; padding: 10px 8px; }
    .week-tab .tab-title { font-size: 9.5px; }
    table { min-width: 580px; }
  }
</style>
</head>
<body data-theme="dark">

<!-- Theme Toggle -->
<button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
  <div class="knob" id="themeIcon">🌙</div>
</button>

<!-- Header -->
<div class="header">
  <div class="header-inner">
    <div class="header-label">Pharmaverse R Onboarding</div>
    <h1>30-Day Clinical Programming Mastery</h1>
    <p>CDISC · SDTM · ADaM · Admiral · FDA-Ready</p>
  </div>
</div>

<!-- Week Tabs -->
<div class="week-tabs" id="weekTabs"></div>

<!-- Content Area -->
<div id="contentArea"></div>

<script>
// ════════════════════════════════════════════════════════════════
// DATA - aligned with how Roche, GSK, J&J actually use pharmaverse
// ════════════════════════════════════════════════════════════════
const data = [
  {
    week: 1,
    title: "Pharmaverse Foundations & SDTM",
    theme: "Hands-On with Real Clinical Data from Day 1",
    days: [
      {
        day: 1,
        focus: "Environment Setup & First SDTM Code",
        topic: "Get coding immediately with pharmaversesdtm",
        details: "Install R, RStudio, and key pharmaverse packages (admiral, pharmaversesdtm, xportr, dplyr, haven). Load pharmaversesdtm example SDTM datasets (dm, ae, ex, lb) - these are the same datasets used by Roche/GSK teams when developing admiral. Explore with glimpse(), head(), View(). Understand CDISC data flow: Raw → SDTM → ADaM → TLFs, and how pharmaverse packages map to each stage. The pharmaverse is a cross-company collaboration (Roche, GSK, J&J, Novartis, Atorus, Merck) solving the same CDISC challenges together.",
        packages: "admiral, pharmaversesdtm, dplyr, haven, xportr",
        deliverable: "Load all pharmaversesdtm SDTM domains, create a script showing domain relationships (DM-AE join, DM-EX merge) with 5+ dplyr operations",
        resources: "pharmaverse.org, pharmaversesdtm GitHub, admiral 'Get Started' vignette"
      },
      {
        day: 2,
        focus: "SDTM Domain Structure & Tidyverse Mastery",
        topic: "Understanding SDTM domain classes through code",
        details: "SDTM has domain classes: Special Purpose (DM), Events (AE, DS), Findings (LB, VS), Interventions (EX, CM). Use pharmaversesdtm data to practice tidyverse: filter AEs by severity, select key DM variables, mutate new flags, group_by treatment arm and summarise counts. Learn variable naming: --TESTCD, --ORRES, --STRESC, --DY patterns. This is 50% of what you'll do daily as a clinical programmer - pharmaverse packages are 50% built on tidyverse.",
        packages: "dplyr, tidyr, pharmaversesdtm",
        deliverable: "Write 10 tidyverse transformations on pharmaversesdtm data: filters, joins, pivots, summaries. Create an AE summary by SOC using group_by + summarise",
        resources: "CDISC SDTM IG v3.4, tidyverse.org, pharmaverse blog: 'The pharmaverse (hi)story'"
      },
      {
        day: 3,
        focus: "Controlled Terminology & MedDRA Coding",
        topic: "Building AE codelists in R",
        details: "Controlled Terminology ensures consistency across submissions. Using pharmaversesdtm AE data, practice creating lookup tables with dplyr for MedDRA coding (AEDECOD → AEBODSYS mapping). Learn CDISC CT concepts: AESEV (MILD/MODERATE/SEVERE), AEREL (RELATED/NOT RELATED), AESER (Y/N). Understand how metacore + metatools automate CT validation. Companies like Roche and GSK use these packages to ensure their derivations comply with CT standards before submission.",
        packages: "dplyr, pharmaversesdtm",
        deliverable: "Create a MedDRA lookup table mapping 15+ AE preferred terms to SOCs, then left_join() to pharmaversesdtm$ae and validate all AEs are coded",
        resources: "CDISC CT Browser, MedDRA hierarchy, metacore documentation"
      },
      {
        day: 4,
        focus: "Clinical Date Derivations with lubridate",
        topic: "Study day, duration, and partial date imputation",
        details: "Dates are central to CDISC: study day (--DY), duration (--DUR), start/end dates (--STDTC, --ENDTC). Use lubridate to parse ISO 8601 dates. Handle partial dates (2024-03--, 2024----) with CDISC imputation rules (earliest for start, latest for end). Derive AESTDY from AESTDTC and RFSTDTC using the formula: study_day = as.numeric(date - reference_date) + 1. This pattern is used across all SDTM domains and later in admiral's ADaM derivations.",
        packages: "lubridate, dplyr, pharmaversesdtm",
        deliverable: "Write reusable functions: impute_partial_date(), derive_study_day(). Apply to pharmaversesdtm$ae to derive AESTDY, AEENDY, AEDUR",
        resources: "lubridate cheatsheet, CDISC SDTM IG date conventions, admiral derive_vars_dt() vignette"
      },
      {
        day: 5,
        focus: "Advanced Tidyverse: Pivoting & Joining",
        topic: "Reshaping SDTM data for analysis",
        details: "SDTM stores data in long format (one row per observation). Practice pivot_wider() to create wide formats (e.g., one row per subject with BP_SYSTOLIC, BP_DIASTOLIC columns from VS). Practice complex joins: DM + AE (demographic context for AEs), DM + EX (treatment exposure). Use anti_join() to find subjects in DM but not in AE (screen failures). These tidyverse patterns are foundational - admiral is essentially tidyverse + CDISC logic.",
        packages: "dplyr, tidyr, pharmaversesdtm",
        deliverable: "Create 3 analysis-ready datasets: (1) wide VS with one row per subject/visit, (2) DM+AE with demographic covariates, (3) screen failure report using anti_join",
        resources: "tidyr pivot vignettes, dplyr two-table verbs, pharmaverse examples site"
      },
      {
        day: 6,
        focus: "Introduction to sdtm.oak",
        topic: "EDC-to-SDTM transformation patterns",
        details: "sdtm.oak is the pharmaverse package for creating SDTM from raw EDC data. It provides reusable algorithm functions for domain classes: Findings (oak_id_vars + condition_add for LB/VS), Events (assign_no_ct for AE), Interventions (hardcode_no_ct for CM). Unlike legacy SAS macros, sdtm.oak is modular and metadata-driven. Explore oak_id_vars() for adding standard SDTM identifier variables (STUDYID, USUBJID, --SEQ). This is how production teams at GSK and Roche build SDTM at scale.",
        packages: "sdtm.oak, dplyr, pharmaversesdtm",
        deliverable: "Use sdtm.oak functions to transform a simulated raw dataset into a valid SDTM LB domain with proper identifiers and test codes",
        resources: "sdtm.oak GitHub, sdtm.oak algorithm vignettes, pharmaverse blog: 'There's a Pharmaverse Package for That'"
      },
      {
        day: 7,
        focus: "Week 1 Capstone: End-to-End SDTM Script",
        topic: "Build DM, AE, EX from scratch with xportr export",
        details: "Combine everything learned: use pharmaversesdtm as a reference to create DM, AE, and EX domains from simulated raw data. Apply variable naming, CT, date derivations, and oak patterns. Use xportr to apply variable labels and export to .xpt (FDA Transport v5 format). xportr was jointly developed by GSK, Atorus, and Appsilon and is the standard for regulatory submission. Run xportr_type(), xportr_length(), xportr_label(), xportr_write() to create submission-ready files.",
        packages: "dplyr, lubridate, sdtm.oak, xportr, haven",
        deliverable: "Produce validated DM.xpt, AE.xpt, EX.xpt (20+ subjects) with proper labels, types, and lengths verified via xportr checks. Document derivation logic in comments.",
        resources: "xportr documentation, pharmaverse examples: SDTM, Week 1 review"
      }
    ]
  },
  {
    week: 2,
    title: "Production SDTM & Validation",
    theme: "Industry-Grade SDTM Workflows from Roche, GSK, J&J",
    days: [
      {

      {

        packages: "dplyr, tidyr, pharmaversesdtm",

      {

        packages: "dplyr, lubridate, sdtm.oak",
        deliverable: "Create an AE domain with full SAE flagging logic, duration derivation, multiple causality assessments, and proper outcome coding from raw CRF data",
        resources: "SDTM IG AE domain, ICH-GCP E2A SAE guidelines, admiral ADAE derivation vignette"

      {

        packages: "dplyr, lubridate, sdtm.oak",
        deliverable: "Derive CM and MH domains with proper ongoing flags, duration calculations, WHODrug coding for CM, and partial date handling",
        resources: "SDTM IG CM and MH specifications, WHO Drug Dictionary, sdtm.oak Interventions algorithms"
      },
      {
        day: 12,

// ════════════════════════════════════════════════════════════════
// THEME STATE & LOGIC
// ════════════════════════════════════════════════════════════════
let currentWeek = 0;
let expandedDay = null;

const weekAccents = ['var(--accent-1)', 'var(--accent-2)', 'var(--accent-3)', 'var(--accent-4)'];
const weekAccentsRaw = {
  dark:  ['#38bdf8','#a78bfa','#4ade80','#fb923c'],
  light: ['#0284c7','#7c3aed','#16a34a','#ea580c']
};

function getAccent(weekIdx) {
  const theme = document.body.dataset.theme;
  return weekAccentsRaw[theme][weekIdx];
}

function toggleTheme() {
  const body = document.body;
  const icon = document.getElementById('themeIcon');
  if (body.dataset.theme === 'dark') {
    body.dataset.theme = 'light';
    icon.textContent = '☀️';
  } else {
    body.dataset.theme = 'dark';
    icon.textContent = '🌙';
  }
  render();
}

// ════════════════════════════════════════════════════════════════
// RENDERING
// ════════════════════════════════════════════════════════════════
function render() {
  renderTabs();
  renderContent();
}

function renderTabs() {
  const container = document.getElementById('weekTabs');
  container.innerHTML = data.map((w, i) => `
    <button class="week-tab" data-week="${i}" data-active="${i === currentWeek}"
            onclick="selectWeek(${i})">
      <div class="tab-label">Week ${i + 1}</div>
      <div class="tab-title">${w.title.split(' &')[0]}</div>
    </button>
  `).join('');
}

function renderContent() {
  const week = data[currentWeek];
  const accent = getAccent(currentWeek);

  // Collect all unique resources for the week
  const allResources = [...new Set(week.days.flatMap(d => d.resources.split(', ')))];

  // Progress gradient
  const theme = document.body.dataset.theme;
  const colors = weekAccentsRaw[theme];
  const pct = ((currentWeek + 1) / 4) * 100;
  const gradStart = colors[0];
  const gradEnd   = colors[currentWeek];

  document.getElementById('contentArea').innerHTML = `
    <!-- Week Header -->
    <div class="week-header" style="background: ${accent}08;">
      <span class="week-badge" style="background: ${accent};">${'WEEK ' + (currentWeek+1)} / DAYS ${week.days[0].day}–${week.days[week.days.length-1].day}</span>
      <div class="week-header-text">
        <h2>${week.title}</h2>
        <p style="color: ${accent};">${week.theme}</p>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="color:${accent}; border-bottom-color:${accent}33;">Day</th>
            <th style="color:${accent}; border-bottom-color:${accent}33;">Focus Area</th>
            <th style="color:${accent}; border-bottom-color:${accent}33;">Topic</th>
            <th style="color:${accent}; border-bottom-color:${accent}33;">Details</th>
            <th style="color:${accent}; border-bottom-color:${accent}33;">Key Packages</th>
            <th style="color:${accent}; border-bottom-color:${accent}33;">Deliverable</th>
          </tr>
        </thead>
        <tbody>
          ${week.days.map((d, idx) => {
            const isExp = expandedDay === d.day;
            const hasPkgs = d.packages !== '-' && d.packages !== '- (conceptual)' && d.packages !== '- (review & preparation)';
            const pkgList = hasPkgs ? d.packages.split(', ') : [];
            const isConceptual = d.packages.includes('conceptual') || d.packages.includes('review');

            return `
              <tr class="day-row" data-expanded="${isExp}" data-day="${d.day}" onclick="toggleDay(${d.day})">
                <td style="min-width:44px;">
                  <div class="day-badge" style="background:${isExp ? accent : accent+'18'}; color:${isExp ? '#0f172a' : accent};">${d.day}</div>
                </td>
                <td style="min-width:145px;">
                  <div class="focus-text">${d.focus}</div>
                </td>
                <td style="min-width:170px;">
                  <div class="topic-text">${d.topic}</div>
                </td>
                <td style="min-width:270px; max-width:370px;">
                  <div class="details-text ${isExp ? 'expanded' : ''}">${d.details}</div>
                  ${!isExp && d.details.length > 90 ? `<div class="expand-hint" style="color:${accent};">↓ click to expand</div>` : ''}
                </td>
                <td style="min-width:140px;">
                  <div class="pkg-tags">
                    ${pkgList.map(p => `<span class="pkg-tag" style="background:${accent}10; color:${accent}; border-color:${accent}22;">${p.trim()}</span>`).join('')}
                    ${(!hasPkgs && !isConceptual) ? '<span class="pkg-none">-</span>' : ''}
                    ${isConceptual ? '<span class="pkg-none" style="font-style:italic;">(conceptual)</span>' : ''}
                  </div>
                </td>
                <td style="min-width:220px;">
                  <div class="deliverable-text" style="border-color:${accent}40;">✓ ${d.deliverable}</div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>

    <!-- Resources -->
    <div class="resources-panel">
      <div class="resources-label">📚 Week ${currentWeek + 1} Key Resources</div>
      <div class="resources-tags">
        ${allResources.map(r => `<span class="resource-tag">${r}</span>`).join('')}
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-row">
        <span class="progress-label">Progress</span>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%; background: linear-gradient(90deg, ${gradStart}, ${gradEnd});"></div>
        </div>
        <span class="progress-pct">${pct}%</span>
      </div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--text-dim);"></div>
        <span class="legend-text">Conceptual</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: ${accent};"></div>
        <span class="legend-text">Hands-on Coding</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--deliverable-color);"></div>
        <span class="legend-text">Deliverable</span>
      </div>
      <span class="legend-hint">Click any row to expand details</span>
    </div>
  `;
}

function selectWeek(idx) {
  currentWeek = idx;
  expandedDay = null;
  render();
}

function toggleDay(dayNum) {
  expandedDay = expandedDay === dayNum ? null : dayNum;
  render();
}

// ─── INIT ───
render();
</script>
</body>
</html>
